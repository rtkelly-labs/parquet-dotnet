name: Lake.Parquet

# Builds, tests and publishes Lake.Parquet: upstream's Parquet.Net, renamed into the Lake.Parquet
# namespace on a throwaway copy, with upstream's own test suite run against the renamed build.
# README.md, "How Lake.Parquet is built", explains the rename.
#
# This file is the fork's own; upstream's build.yml is left as upstream wrote it and still runs.
# `lake-ci` is the required check. Unlike upstream's workflow it has no paths-ignore, so a PR that
# only edits a change record still reports it. A rebaselined stack is pushed to staging/<name> and
# built here first: `lake-stack rebaseline --push` publishes it to master only once lake-ci passed on
# that exact commit (Lake.NET docs/lake-parquet/maintaining.md, "Rebaselining onto upstream"). Rebaselines never run here.
#
# Actions are pinned to commit SHAs by hand: rig's pinning policy is not applied to forks, because
# it would also rewrite upstream's workflow and conflict on every rebase.

on:
  pull_request:
    branches: [master]
  push:
    # staging/*: a rebaselined stack, built here before it may replace master (Lake.NET docs/lake-parquet/maintaining.md).
    branches: [master, "staging/**"]
  workflow_dispatch:
    inputs:
      conformance_cases:
        description: "Conformance cases per direction, on fresh seeds (Lake.NET docs/lake-parquet/testing.md); 200 from seed 1 when empty"
        required: false
        default: ""
        type: string
      verify_changes:
        description: "Verify every change alone (lake-stack verify), as on staging branches"
        required: false
        default: false
        type: boolean
      publish:
        description: "Publish the version in eng/lake/Lake.Parquet.targets to nuget.org and tag lake-v<version>"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  LAKE_TARGETS: ${{ github.workspace }}/eng/lake/Lake.Parquet.targets

jobs:
  # The stack's rules (Lake.NET docs/lake-parquet/changes.md), enforced by eng/lake/Lake.Stack after its own tests
  # pass. A pull request is squash-merged, so its commits are not checked one by one: its title
  # becomes the commit and must name the change.
  stack:
    name: stack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/aloneguid/parquet-dotnet.git
          git fetch --quiet upstream master

      - name: Test the stack tool
        run: dotnet test eng/lake/Lake.Stack.Tests --configuration Release

      # Subjects and titles are commitlint's (commitlint.config.mjs); records and the stack's structure are
      # lake-stack's.
      - name: Lint the pull request title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | npx --yes @commitlint/cli@21.2.3

      - name: Check the pull request
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: dotnet run --project eng/lake/Lake.Stack --configuration Release -- check-pr --title "$TITLE" --base "$BASE"

      - name: Lint the stack's commit subjects
        if: github.event_name != 'pull_request'
        run: npx --yes @commitlint/cli@21.2.3 --from "$(git merge-base HEAD upstream/master)" --to HEAD

      - name: Check the stack
        if: github.event_name != 'pull_request'
        run: dotnet run --project eng/lake/Lake.Stack --configuration Release -- check

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Upstream's interop tests read files back with pyarrow; build.yml installs the same.
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: pip install pyarrow pandas

      - name: Read the Lake.Parquet version
        id: version
        run: |
          set -euo pipefail
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' eng/lake/Lake.Parquet.targets)
          [ -n "$version" ] || { echo "::error::no <Version> in eng/lake/Lake.Parquet.targets"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Lake.Parquet $version"

      # The checkout keeps upstream's namespaces so rebases onto upstream stay conflict-free; only
      # this copy is renamed.
      - name: Rename a copy to Lake.Parquet
        run: |
          set -euo pipefail
          rsync -a --exclude .git ./ "$RUNNER_TEMP/lake/"
          dotnet run eng/lake/StripMembers.cs -- "$RUNNER_TEMP/lake" eng/lake/strip-members.json
          dotnet run eng/lake/RenameNamespace.cs -- "$RUNNER_TEMP/lake/src" Parquet Lake.Parquet

      # Both hooks: CustomBefore...Targets renames the assembly in each target framework's build,
      # and CustomBefore...CrossTargetingTargets sets the package id and version in the outer build
      # that packs. Build first, then pack --no-build: upstream's GeneratePackageOnBuild otherwise
      # races the pack.
      - name: Build
        working-directory: ${{ runner.temp }}/lake
        run: >-
          dotnet build src/Parquet.Test/Parquet.Test.csproj --configuration Release
          -p:CustomBeforeMicrosoftCommonTargets="$LAKE_TARGETS"
          -p:CustomBeforeMicrosoftCommonCrossTargetingTargets="$LAKE_TARGETS"
          && dotnet build src/Parquet/Parquet.csproj --configuration Release
          -p:CustomBeforeMicrosoftCommonTargets="$LAKE_TARGETS"
          -p:CustomBeforeMicrosoftCommonCrossTargetingTargets="$LAKE_TARGETS"

      - name: Verify the assemblies are renamed
        working-directory: ${{ runner.temp }}/lake
        run: >-
          dotnet run "$GITHUB_WORKSPACE/eng/lake/VerifyLakeAssembly.cs" --
          src/Parquet/bin/Release/net10.0/Lake.Parquet.dll
          src/Parquet/bin/Release/net8.0/Lake.Parquet.dll

      # Upstream's own suite and every change's tests, against the renamed build.
      - name: Test
        working-directory: ${{ runner.temp }}/lake
        run: >-
          dotnet test src/Parquet.Test/Parquet.Test.csproj --configuration Release --no-build
          -p:CustomBeforeMicrosoftCommonTargets="$LAKE_TARGETS"
          -p:CustomBeforeMicrosoftCommonCrossTargetingTargets="$LAKE_TARGETS"

      - name: Pack
        working-directory: ${{ runner.temp }}/lake
        run: >-
          dotnet pack src/Parquet/Parquet.csproj --configuration Release --no-build
          -p:CustomBeforeMicrosoftCommonTargets="$LAKE_TARGETS"
          -p:CustomBeforeMicrosoftCommonCrossTargetingTargets="$LAKE_TARGETS"
          --output "$GITHUB_WORKSPACE/artifacts"

      - name: Check the package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          pkg="artifacts/Lake.Parquet.$VERSION.nupkg"
          [ -f "$pkg" ] || { echo "::error::$pkg was not produced"; ls artifacts; exit 1; }
          entries=$(unzip -Z1 "$pkg")
          for want in LICENSE PACKAGE_README.md lib/net8.0/Lake.Parquet.dll lib/net10.0/Lake.Parquet.dll; do
            grep -qx "$want" <<< "$entries" || { echo "::error::$pkg lacks $want"; exit 1; }
          done
          if grep -q "Parquet.dll$" <<< "$(grep -v Lake.Parquet.dll <<< "$entries")"; then
            echo "::error::$pkg still carries an upstream-named assembly"; exit 1
          fi
          echo "$entries"

      - name: Upload the package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lake-parquet
          path: artifacts/*
          if-no-files-found: error

  # The single required check.
  # Generated cases, both directions, against parquet-cpp (Lake.NET docs/lake-parquet/testing.md, "The conformance harness").
  # The whole suite on the plain build, serializer included. The build job tests the renamed package, which
  # leaves the serializer and its tests out; this keeps every test that also covers other code (encryption,
  # the test-file corpus, legacy lists) running against the fork's code.
  suite:
    name: suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: pip install pyarrow pandas

      - name: Test
        run: dotnet test src/Parquet.Test/Parquet.Test.csproj --configuration Release

  conformance:
    name: conformance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Run the cases
        env:
          CASES: ${{ inputs.conformance_cases }}
          RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -n "$CASES" ]; then
            # a deep run explores seeds no earlier run used
            export LAKE_CONFORMANCE_CASES="$CASES" LAKE_CONFORMANCE_FROM=$(( (RUN % 100000) * 10000 + 1000 ))
          fi
          export LAKE_CONFORMANCE_KEEP="$RUNNER_TEMP/failing"
          dotnet test eng/lake/Lake.Parquet.Conformance --configuration Release

      - name: Keep the failing files
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: conformance-failures
          path: ${{ runner.temp }}/failing
          if-no-files-found: ignore

  # Each code change alone on upstream (Lake.NET docs/lake-parquet/testing.md, "Change verification"): on staging branches, so a
  # rebaseline is promoted only when every change still proves itself on the new upstream, and on demand.
  changes:
    name: changes
    if: startsWith(github.ref, 'refs/heads/staging/') || inputs.verify_changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: List the code changes
        id: list
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/aloneguid/parquet-dotnet.git
          git fetch --quiet upstream master
          list=$(dotnet run --project eng/lake/Lake.Stack --configuration Release -- verify --list)
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "$list"

  verify:
    name: verify ${{ matrix.change }}
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        change: ${{ fromJSON(needs.changes.outputs.list) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: pip install pyarrow pandas

      - name: Verify the change alone
        env:
          CHANGE: ${{ matrix.change }}
        run: |
          set -euo pipefail
          git config user.name "lake-ci"
          git config user.email "lake-ci@users.noreply.github.com"
          git remote add upstream https://github.com/aloneguid/parquet-dotnet.git
          git fetch --quiet upstream master
          dotnet run --project eng/lake/Lake.Stack --configuration Release -- verify "$CHANGE"

  # The single required check. Jobs that do not run for an event (verify outside staging) are skipped,
  # which counts as passing; anything that ran must have succeeded.
  lake-ci:
    name: lake-ci
    if: always()
    needs: [stack, build, suite, conformance, changes, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job that ran
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')
          [ -z "$failed" ] || { echo "::error::did not succeed: $failed"; exit 1; }
          for required in stack build suite conformance; do
            [ "$(echo "$RESULTS" | jq -r ".$required.result")" = "success" ] || { echo "::error::$required did not succeed"; exit 1; }
          done

  publish:
    name: publish
    needs: [build]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create tags lake-v<version>, which pins this stack for good
      id-token: write # NuGet/login exchanges the OIDC token (trusted publishing)
    environment: release
    steps:
      - name: Download the package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lake-parquet
          path: ./artifacts

      - name: Login to NuGet via OIDC (Trusted Publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER || 'rtk_13' }}

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push ./artifacts/*.nupkg --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Find the upstream commit
        run: |
          git remote add upstream https://github.com/aloneguid/parquet-dotnet.git
          git fetch --quiet upstream master
          echo "UPSTREAM_SHA=$(git merge-base HEAD upstream/master)" >> "$GITHUB_ENV"

      # the changes this release carries, one line each (cliff.toml)
      - name: Write the release notes
        run: |
          set -euo pipefail
          { echo "Lake.Parquet $VERSION, built on aloneguid/parquet-dotnet@$UPSTREAM_SHA."; echo;
            npx --yes git-cliff@2.14.2 --config cliff.toml "$UPSTREAM_SHA..HEAD"; } > "$RUNNER_TEMP/notes.md"
        env:
          VERSION: ${{ needs.build.outputs.version }}

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: >-
          gh release create "lake-v$VERSION" ./artifacts/*.nupkg --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA" --title "Lake.Parquet $VERSION"
          --notes-file "$RUNNER_TEMP/notes.md"
